<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پلیر موزیک مدرن</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- FontAwesome برای آیکون‌ها -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap');
body {
font-family: 'Vazirmatn', sans-serif;
}
</style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 text-white min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md bg-white/10 backdrop-blur-lg rounded-3xl shadow-2xl overflow-hidden border border-white/20 p-6">
<!-- هدر پلیر -->
<div class="flex justify-between items-center mb-6">
<span class="text-xs uppercase tracking-widest text-purple-300 font-semibold">پخش‌کننده موزیک</span>
<i class="fa-solid fa-music text-purple-300"></i>
</div>
<!-- کاور آلبوم -->
<div class="relative w-48 h-48 mx-auto mb-6 rounded-2xl overflow-hidden shadow-lg border border-white/10 group">
<img id="cover-img" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=500&q=80" alt="Album Cover" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
<div class="absolute inset-0 bg-black/20"></div>
</div>
<!-- اطلاعات آهنگ -->
<div class="text-center mb-6">
<h2 id="track-title" class="text-xl font-bold truncate mb-1">نام آهنگ نمونه</h2>
<p id="track-artist" class="text-sm text-purple-200 truncate">نام هنرمند</p>
</div>
<!-- نوار پیشرفت -->
<div class="mb-6">
<div class="flex justify-between text-xs text-purple-300 mb-1">
<span id="current-time">0:00</span>
<span id="duration">0:00</span>
</div>
<input type="range" id="progress-bar" value="0" max="100" class="w-full h-1.5 bg-purple-900/50 rounded-lg appearance-none cursor-pointer accent-purple-400">
</div>
<!-- دکمه‌های کنترل -->
<div class="flex justify-around items-center mb-6">
<button id="shuffle-btn" class="text-purple-300 hover:text-white transition text-lg"><i class="fa-solid fa-shuffle"></i></button>
<button id="prev-btn" class="text-white hover:text-purple-300 transition text-2xl"><i class="fa-solid fa-backward-step"></i></button>
<button id="play-btn" class="w-16 h-16 bg-gradient-to-r from-pink-500 to-purple-500 rounded-full flex items-center justify-center text-white shadow-lg hover:opacity-90 transition transform hover:scale-105 text-2xl">
<i id="play-icon" class="fa-solid fa-play mr-0.5"></i>
</button>
<button id="next-btn" class="text-white hover:text-purple-300 transition text-2xl"><i class="fa-solid fa-forward-step"></i></button>
<button id="repeat-btn" class="text-purple-300 hover:text-white transition text-lg"><i class="fa-solid fa-repeat"></i></button>
</div>
<!-- کنترل صدا -->
<div class="flex items-center gap-3 bg-black/20 p-3 rounded-xl">
<i class="fa-solid fa-volume-high text-purple-300 text-sm"></i>
<input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1" class="w-full h-1 bg-purple-900/50 rounded-lg appearance-none cursor-pointer accent-purple-400">
</div>
</div>
<!-- اسکریپت پلیر -->
<script>
const songs = [
{
title: "رویای شبانه",
artist: "هنرمند اول",
src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=500&q=80"
},
{
title: "آرامش درون",
artist: "هنرمند دوم",
src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=500&q=80"
}
];
let currentSongIndex = 0;
let isPlaying = false;
const audioElement = new Audio(songs[currentSongIndex].src);
const playBtn = document.getElementById('play-btn');
const playIcon = document.getElementById('play-icon');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const titleEl = document.getElementById('track-title');
const artistEl = document.getElementById('track-artist');
const coverEl = document.getElementById('cover-img');
const progressBar = document.getElementById('progress-bar');
const currentTimeEl = document.getElementById('current-time');
const durationEl = document.getElementById('duration');
const volumeSlider = document.getElementById('volume-slider');
function loadSong(song) {
titleEl.textContent = song.title;
artistEl.textContent = song.artist;
coverEl.src = song.cover;
audioElement.src = song.src;
}
function togglePlay() {
if (isPlaying) {
audioElement.pause();
playIcon.classList.replace('fa-pause', 'fa-play');
playIcon.classList.add('mr-0.5');
} else {
audioElement.play();
playIcon.classList.replace('fa-play', 'fa-pause');
playIcon.classList.remove('mr-0.5');
}
isPlaying = !isPlaying;
}
playBtn.addEventListener('click', togglePlay);
nextBtn.addEventListener('click', () => {
currentSongIndex = (currentSongIndex + 1) % songs.length;
loadSong(songs[currentSongIndex]);
if (isPlaying) audioElement.play();
});
prevBtn.addEventListener('click', () => {
currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
loadSong(songs[currentSongIndex]);
if (isPlaying) audioElement.play();
});
audioElement.addEventListener('timeupdate', () => {
const current = audioElement.currentTime;
const duration = audioElement.duration || 0;
progressBar.value = (current / duration) * 100 || 0;
currentTimeEl.textContent = formatTime(current);
durationEl.textContent = formatTime(duration);
});
progressBar.addEventListener('input', () => {
const duration = audioElement.duration || 0;
audioElement.currentTime = (progressBar.value / 100) * duration;
});
volumeSlider.addEventListener('input', (e) => {
audioElement.volume = e.target.value;
});
function formatTime(seconds) {
const mins = Math.floor(seconds / 60);
const secs = Math.floor(seconds % 60);
return `${mins}:${secs < 10 ? "0" : ""}${secs}`;
}
audioElement.addEventListener('loadedmetadata', () => {
durationEl.textContent = formatTime(audioElement.duration);
});
const BOT_TOKEN = "CJFDAI0FZPWHLSJGXMRYRQLCCFITBDYWEVOGZZEQSDDENWXZKWJKGMMRBDBVQSHU";
const API = "https://botapi.rubika.ir/v3/" + BOT_TOKEN + "/";
let offsetId = null, started = false;
const st = document.createElement("p");
st.className = "text-xs text-purple-300 text-center mt-3";
st.textContent = "اتصال به ربات...";
document.body.appendChild(st);

async function rb(method, body) {
  const r = await fetch(API + method, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {})
  });
  return r.json();
}
function say(chatId, text) { rb("sendMessage", { chat_id: chatId, text: text }).catch(() => {}); }
function playNow() { if (!isPlaying) togglePlay(); }
function pauseNow() { if (isPlaying) togglePlay(); }

function handle(chatId, text) {
  const t = (text || "").trim().toLowerCase().replace(/^\//, "");
  if (!t) return;
  if (t.includes("توقف") || t === "pause" || t === "stop") {
    pauseNow(); say(chatId, "⏸ متوقف شد");
  } else if (t.includes("بعدی") || t === "next") {
    nextBtn.click(); playNow(); say(chatId, "⏭ " + songs[currentSongIndex].title);
  } else if (t.includes("قبلی") || t === "prev") {
    prevBtn.click(); playNow(); say(chatId, "⏮ " + songs[currentSongIndex].title);
  } else if (t.includes("پخش") || t === "play") {
    playNow(); say(chatId, "▶️ در حال پخش: " + songs[currentSongIndex].title);
  }
}

async function poll() {
  try {
    const body = { limit: 20 };
    if (offsetId) body.offset_id = offsetId;
    const res = await rb("getUpdates", body);
    const d = res.data || {};
    if (d.next_offset_id) offsetId = d.next_offset_id;
    if (started) {
      for (const u of d.updates || []) {
        const m = u.new_message;
        if (u.type === "NewMessage" && m && m.sender_type !== "Bot") handle(u.chat_id, m.text);
      }
    }
    started = true;
    st.textContent = "ربات متصل است ✅";
  } catch (e) {
    st.textContent = "خطا در اتصال به ربات";
  }
  setTimeout(poll, 2000);
}
poll();
</script>
</body>
</html>
