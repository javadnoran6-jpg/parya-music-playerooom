<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سازنده ویدیو پری</title>
<style>
:root{--bg:#120a24;--card:#1e1238;--text:#f3ecff;--acc:#b066ff;--mut:#9a8bb8}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,system-ui,sans-serif;background:radial-gradient(circle at top,#2a1457,var(--bg));color:var(--text);min-height:100vh;padding:16px}
main{max-width:560px;margin:auto}
h1{text-align:center;font-size:1.5rem}
.tabs{display:flex;gap:8px;margin:16px 0}
.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:var(--card);color:var(--mut);font:inherit}
.tabs button.on{background:var(--acc);color:#fff}
.card{background:var(--card);border-radius:16px;padding:16px}
textarea,select,input{width:100%;padding:10px;border-radius:10px;border:1px solid #3a2a60;background:#150c2b;color:var(--text);font:inherit;margin:6px 0 12px}
.eyes{display:flex;gap:10px;margin:6px 0 14px}
.eyes label{width:38px;height:38px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.eyes input{display:none}
.eyes input:checked+span{outline:3px solid #fff}
.eyes span{display:block;width:100%;height:100%;border-radius:50%}
.go{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,#b066ff,#ff66c4);color:#fff;font:inherit;font-weight:bold}
.go:disabled{opacity:.5}
#status{margin-top:14px;text-align:center;color:var(--mut)}
video{width:100%;border-radius:12px;margin-top:12px}
</style>
</head>
<body>
<main>
<h1>🧚 سازنده ویدیو پری چشم‌رنگی</h1>
<div class="tabs">
<button id="t1" class="on">متن به ویدیو</button>
<button id="t2">ساخت خودکار</button>
</div>
<div class="card">
<div id="p1"><label>توضیح صحنه</label>
<textarea id="prompt" rows="4" placeholder="مثلاً: پری در جنگل شبانه بین کرم‌های شب‌تاب پرواز می‌کند"></textarea></div>
<div id="p2" hidden><label>ایده داستان</label>
<textarea id="idea" rows="4" placeholder="ایده کلی داستان را بنویس؛ صحنه‌ها خودکار ساخته می‌شوند"></textarea>
<label>تعداد صحنه</label>
<select id="scenes"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>
<label>رنگ چشم پری</label>
<div class="eyes" id="eyes"></div>
<button class="go" id="go">بساز ✨</button>
<div id="status"></div>
<div id="result"></div>
</div>
</main>
<script>
const colors={blue:'#3aa0ff',green:'#35d07f',violet:'#a35bff',amber:'#ffb02e',pink:'#ff5fb0',red:'#ff4d4d'};
let eye='blue',mode=1;
const $=id=>document.getElementById(id);
$('eyes').innerHTML=Object.entries(colors).map(([k,c],i)=>
 `<label><input type="radio" name="e" value="${k}" ${i?'':'checked'}><span style="background:${c}"></span></label>`).join('');
document.querySelectorAll('input[name=e]').forEach(r=>r.onchange=()=>eye=r.value);
function tab(m){mode=m;$('p1').hidden=m!==1;$('p2').hidden=m!==2;$('t1').classList.toggle('on',m===1);$('t2').classList.toggle('on',m===2)}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
$('go').onclick=async()=>{
 $('go').disabled=true;$('result').innerHTML='';$('status').textContent='در حال ارسال…';
 try{
  const url=mode===1?'/api/text-to-video':'/api/auto-video';
  const body=mode===1?{prompt:$('prompt').value,eyeColor:eye}:{idea:$('idea').value,eyeColor:eye,scenes:$('scenes').value};
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const {id,error}=await r.json(); if(error) throw new Error(error);
  while(true){
   await new Promise(r=>setTimeout(r,3000));
   const s=await (await fetch('/api/status/'+id)).json();
   if(s.status==='done'){$('status').textContent='آماده شد ✅';$('result').innerHTML=`<video src="${s.url}" controls autoplay loop playsinline></video><a href="${s.url}" download style="color:#b066ff">دانلود</a>`;break}
   if(s.status==='error') throw new Error(s.error);
   $('status').textContent=s.progress||'در حال ساخت…';
  }
 }catch(e){$('status').textContent='خطا: '+e.message}
 $('go').disabled=false;
};
</script>
</body>
</html>
