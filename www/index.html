<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پلیر موزیک</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:linear-gradient(135deg,#312e81,#581c87,#0f172a);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:420px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:20px}
.hd{display:flex;justify-content:space-between;color:#d8b4fe;font-size:13px;margin-bottom:16px}
.cover{width:180px;height:180px;margin:0 auto 16px;border-radius:20px;background:linear-gradient(135deg,#ec4899,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:72px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.cover.spin{animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
h2{text-align:center;font-size:20px;margin-bottom:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.artist{text-align:center;color:#e9d5ff;font-size:14px;margin-bottom:16px}
.times{display:flex;justify-content:space-between;color:#d8b4fe;font-size:12px;direction:ltr;margin-bottom:4px}
input[type=range]{width:100%;accent-color:#c084fc;direction:ltr}
.ctrl{display:flex;justify-content:space-around;align-items:center;margin:16px 0;direction:ltr}
.ctrl button{background:none;border:none;color:#fff;font-size:26px;padding:8px}
.ctrl .sm{color:#d8b4fe;font-size:20px}.ctrl .on{color:#f0abfc}
#play{width:64px;height:64px;border-radius:50%;background:linear-gradient(90deg,#ec4899,#a855f7);font-size:26px}
.box{background:rgba(0,0,0,.2);border-radius:14px;padding:12px;margin-top:12px}
.row{display:flex;gap:8px;align-items:center}
.row input[type=text]{flex:1;min-width:0;background:rgba(255,255,255,.1);border:none;border-radius:10px;padding:10px;color:#fff;font-size:14px;outline:none;font-family:inherit}
.btn{background:rgba(255,255,255,.12);border:none;border-radius:10px;color:#fff;padding:10px 12px;font-size:16px;font-family:inherit}
.go{background:linear-gradient(90deg,#ec4899,#a855f7)}
#bot{font-size:14px;color:#f3e8ff;margin:8px 0;min-height:20px}
.lbl{font-size:12px;color:#d8b4fe}
#list{max-height:110px;overflow:auto;margin-top:8px;font-size:13px}
#list div{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.08)}
#list .cur{color:#f0abfc;font-weight:bold}
#pick{display:none}
</style>
</head>
<body>
<div class="card">
<div class="hd"><span>پخش‌کننده موزیک</span><span>♪</span></div>
<div class="cover" id="cover">🎵</div>
<h2 id="title">آهنگی انتخاب نشده</h2>
<p class="artist" id="artist">دکمهٔ «افزودن آهنگ» را بزن</p>
<div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
<input type="range" id="bar" value="0" max="100">
<div class="ctrl">
<button class="sm" id="shuf">🔀</button>
<button id="prev">⏮</button>
<button id="play">▶</button>
<button id="next">⏭</button>
<button class="sm" id="rep">🔁</button>
</div>
<div class="box"><div class="row"><span class="lbl">🔊</span><input type="range" id="vol" min="0" max="1" step="0.01" value="1"></div></div>
<div class="box">
<div class="row" style="justify-content:space-between"><span class="lbl">لیست آهنگ‌ها</span>
<button class="btn go" id="add">➕ افزودن آهنگ</button></div>
<input type="file" id="pick" accept="audio/*" multiple>
<div id="list"></div>
</div>
<div class="box">
<div class="lbl">🤖 ربات موزیک</div>
<div id="bot">بگو: «موزیک پخش کن»</div>
<div class="row">
<input type="text" id="cmd" placeholder="دستور بده...">
<button class="btn" id="mic">🎤</button>
<button class="btn go" id="send">➤</button>
</div></div>
<div class="box">
<div class="lbl">⚙️ اتصال ربات روبیکا</div>
<div class="row" style="margin-top:8px">
<input type="password" id="tok" placeholder="توکن ربات را اینجا بچسبان" style="flex:1;min-width:0;background:rgba(255,255,255,.1);border:none;border-radius:10px;padding:10px;color:#fff;font-size:13px;outline:none;direction:ltr">
<button class="btn go" id="conn">اتصال</button>
</div>
<div id="rstat" class="lbl" style="margin-top:6px">متصل نیست</div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
let songs=[],idx=0,playing=false,shuffle=false,repeat=false;
const a=new Audio();
function say(t){$('bot').textContent=t}
function fmt(s){s=isFinite(s)?s:0;const m=Math.floor(s/60),c=Math.floor(s%60);return m+':'+(c<10?'0':'')+c}
function renderList(){
$('list').innerHTML='';
songs.forEach((s,i)=>{const d=document.createElement('div');d.textContent=(i+1)+'. '+s.title;if(i===idx)d.className='cur';d.onclick=()=>{go(i);setPlay(true)};$('list').appendChild(d)});
}
function load(){
const s=songs[idx];
if(!s){$('title').textContent='آهنگی انتخاب نشده';$('artist').textContent='دکمهٔ «افزودن آهنگ» را بزن';return}
a.src=s.url;$('title').textContent=s.title;$('artist').textContent='آهنگ '+(idx+1)+' از '+songs.length;renderList();
}
function go(i){if(!songs.length)return;idx=(i+songs.length)%songs.length;load();if(playing)a.play().catch(()=>{})}
function setPlay(w){
if(!songs.length){say('اول آهنگ اضافه کن');return}
if(w){if(!a.src)load();a.play().then(()=>{playing=true;ui()}).catch(()=>say('پخش نشد'))}
else{a.pause();playing=false;ui()}
}
function ui(){$('play').textContent=playing?'⏸':'▶';$('cover').classList.toggle('spin',playing)}
$('play').onclick=()=>setPlay(!playing);
$('next').onclick=()=>{go(shuffle?Math.floor(Math.random()*songs.length):idx+1)};
$('prev').onclick=()=>go(idx-1);
$('shuf').onclick=()=>{shuffle=!shuffle;$('shuf').classList.toggle('on',shuffle)};
$('rep').onclick=()=>{repeat=!repeat;$('rep').classList.toggle('on',repeat)};
a.onended=()=>{if(repeat){a.currentTime=0;a.play()}else go(shuffle?Math.floor(Math.random()*songs.length):idx+1)};
a.ontimeupdate=()=>{$('bar').value=a.duration?a.currentTime/a.duration*100:0;$('cur').textContent=fmt(a.currentTime)};
a.onloadedmetadata=()=>$('dur').textContent=fmt(a.duration);
$('bar').oninput=()=>{if(a.duration)a.currentTime=$('bar').value/100*a.duration};
$('vol').oninput=e=>a.volume=e.target.value;
$('add').onclick=()=>$('pick').click();
$('pick').onchange=e=>{
const first=songs.length;
[...e.target.files].forEach(f=>songs.push({title:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f)}));
if(e.target.files.length){say(e.target.files.length+' آهنگ اضافه شد');if(!first){idx=0;load()}else renderList()}
e.target.value='';
};
function cmd(raw){
const t=raw.trim().toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک');if(!t)return;
const has=(...w)=>w.some(x=>t.includes(x));
const n=songs.findIndex(s=>t.includes(s.title.toLowerCase()));
if(n>=0){go(n);setPlay(true);say('پخش شد: '+songs[n].title);return}
if(has('بعدی','next')){go(idx+1);say('بعدی: '+(songs[idx]||{title:''}).title);return}
if(has('قبلی','prev')){go(idx-1);say('قبلی: '+(songs[idx]||{title:''}).title);return}
if(has('بلند','زیاد')){a.volume=Math.min(1,a.volume+.2);$('vol').value=a.volume;say('صدا بلندتر شد');return}
if(has('کم کن','آروم','آرام')){a.volume=Math.max(0,a.volume-.2);$('vol').value=a.volume;say('صدا کمتر شد');return}
if(has('قطع','توقف','بس','استپ','متوقف','stop','pause','خاموش')){setPlay(false);say('متوقف شد');return}
if(has('پخش','پلی','play','شروع','بزن','موزیک','آهنگ')){setPlay(true);if(songs.length)say('در حال پخش: '+songs[idx].title);return}
say('متوجه نشدم. بگو: پخش، توقف، بعدی، قبلی');
}
function submit(){cmd($('cmd').value);$('cmd').value=''}
$('send').onclick=submit;
$('cmd').onkeydown=e=>{if(e.key==='Enter')submit()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){const r=new SR();r.lang='fa-IR';r.onresult=e=>{$('cmd').value=e.results[0][0].transcript;submit()};r.onerror=()=>say('میکروفون در دسترس نیست');
$('mic').onclick=()=>{try{r.start();say('گوش می‌دهم...')}catch(e){}}}
else $('mic').onclick=()=>say('دستور صوتی اینجا نیست، تایپ کن');
const API='https://botapi.rubika.ir/v3/';
let timer=null,offset=null,seen=new Set(),first=true;
function rstat(t){$('rstat').textContent=t}
async function rcall(token,method,body){
const r=await fetch(API+token+'/'+method,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
return r.json();
}
async function poll(token){
try{
const body={limit:20};if(offset)body.offset_id=offset;
const res=await rcall(token,'getUpdates',body);
const d=res.data||res;
if(d.next_offset_id)offset=d.next_offset_id;
const ups=d.updates||[];
for(const u of ups){
const m=u.new_message||u.message;if(!m||!m.text)continue;
const key=(u.chat_id||'')+':'+(m.message_id||m.time||m.text);
if(seen.has(key))continue;seen.add(key);
if(first)continue;
cmd(m.text);
await rcall(token,'sendMessage',{chat_id:u.chat_id,text:$('bot').textContent});
}
first=false;
rstat('متصل ✅ منتظر دستور...');
}catch(e){rstat('خطا در اتصال. اینترنت را بررسی کن')}
}
function startBot(token){
if(timer)clearInterval(timer);
first=true;offset=null;seen=new Set();
rstat('در حال اتصال...');
poll(token);timer=setInterval(()=>poll(token),3000);
}
$('conn').onclick=()=>{
const t=$('tok').value.trim();if(!t)return;
try{localStorage.setItem('rb_token',t)}catch(e){}
$('tok').value='';startBot(t);
};
try{const t=localStorage.getItem('rb_token');if(t)startBot(t)}catch(e){}
</script>
</body>
</html>
